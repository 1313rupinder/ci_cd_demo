<!DOCTYPE html>
<html>
<head>
    <title>Calculator App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            text-align: center;
            font-size: 20px;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #ffebee;
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Calculator</h1>

    <form method="POST">

        <input
            type="number"
            step="any"
            name="num1"
            placeholder="Enter first number"
            required
        >

        <select name="operation">
            <option value="add">Addition (+)</option>
            <option value="subtract">Subtraction (-)</option>
            <option value="multiply">Multiplication (×)</option>
            <option value="divide">Division (÷)</option>
        </select>

        <input
            type="number"
            step="any"
            name="num2"
            placeholder="Enter second number"
            required
        >

        <button type="submit">Calculate</button>

    </form>

    {% if result is not none %}
        <div class="result">
            Result: <strong>{{ result }}</strong>
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
